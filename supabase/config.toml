project_id = "NightOS"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your NightOS code is {{ .Code }}"
max_frequency = "60s"
hook = "http://localhost:54321/functions/v1/mnotify-sms"

[auth.rate_limit]
sms_sent = 60
sign_in_sign_ups = 30
token_verifications = 30

[storage]
enabled = true
file_size_limit = "5MiB"
