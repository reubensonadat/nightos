<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/bysen-logo.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="/bysen-logo.jpg" />
    <link rel="apple-touch-icon" href="/bysen-logo.jpg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F3F3E3" />
    <meta name="title" content="Bysen — Modern Venue Operations" />
    <meta name="description" content="Bysen — The operating system for modern venues. Real-time ordering, table management, and POS." />
    
    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bysen" />
    <meta property="og:title" content="Bysen — Modern Venue Operations" />
    <meta property="og:description" content="Bysen — The operating system for modern venues." />
    <meta property="og:image" content="/bysen-logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bysen — Modern Venue Operations" />
    <meta name="twitter:description" content="Bysen — The operating system for modern venues." />

    <!-- Preconnect to Google Fonts for faster Inter + JetBrains Mono load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F3F3E3;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      @keyframes sk-dot-wave {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
    </style>

    <title>Bysen</title>
  </head>
  <body>
    <div id="root">
      <div id="skeleton" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;width:100%;background:#F3F3E3;color:#23140C;font-family:system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center;">
        <h1 id="skeleton-title" style="font-size:clamp(22px,5vw,36px);font-weight:900;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 24px 0;color:#23140C;font-family:ui-serif,Georgia,serif;">BYSEN</h1>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div style="display:flex;align-items:center;gap:7px;">
            <span style="width:8px;height:8px;border-radius:50%;background:#23140C;animation:sk-dot-wave 1.1s ease-in-out infinite;animation-delay:0s;"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#23140C;animation:sk-dot-wave 1.1s ease-in-out infinite;animation-delay:0.15s;"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#23140C;animation:sk-dot-wave 1.1s ease-in-out infinite;animation-delay:0.30s;"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#23140C;animation:sk-dot-wave 1.1s ease-in-out infinite;animation-delay:0.45s;"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#23140C;animation:sk-dot-wave 1.1s ease-in-out infinite;animation-delay:0.60s;"></span>
          </div>
          <p style="font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:#606F69;margin:0;">LOADING</p>
        </div>
      </div>
      <script>
        try {
          var name = localStorage.getItem("nightos:active_venue_name");
          if (!name || name === "null" || name === "undefined" || name === "Your Venue") {
            var m = window.location.pathname.match(/^\/v\/([^/]+)/);
            if (m && m[1]) {
              name = m[1].replace(/[-_]/g, " ").replace(/\b\w/g, function(c){ return c.toUpperCase(); });
            } else {
              name = "Bysen";
            }
          }
          if (name && name !== "null" && name !== "undefined") {
            var el = document.getElementById("skeleton-title");
            if (el) el.textContent = name;
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
