<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bysen-logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/bysen-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F3F3E3" />
    <meta name="description" content="Velvet Lounge — A premium ordering experience powered by Bysen." />

    <!-- Preconnect to Google Fonts for Plus Jakarta Sans, Outfit, Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />

    <title>Velvet Lounge · Bysen</title>
  </head>
  <body>
    <div id="root">
      <div id="skeleton" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;background:#0a0a0a;color:#c9a96e;font-family:system-ui;gap:16px;">
        <div style="width:48px;height:48px;border:3px solid rgba(201,169,110,0.2);border-top-color:#c9a96e;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="font-size:13px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.6;">Loading Velvet Lounge</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
